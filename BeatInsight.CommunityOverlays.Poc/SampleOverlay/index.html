<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>BeatInsight — sample tosu overlay</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Overlay d'exemple écrit comme un overlay tosu ordinaire :
         il ne sait pas qu'il tourne dans BeatInsight. -->
    <main class="card">
        <header>
            <div id="title" class="title">—</div>
            <div id="meta" class="meta">—</div>
        </header>
        <section class="row">
            <span id="state" class="pill">state —</span>
            <span id="mods" class="pill">NM</span>
            <span id="time" class="pill">0:00 / 0:00</span>
        </section>
        <section class="grid">
            <div><label>Combo</label><b id="combo">0x</b></div>
            <div><label>Accuracy</label><b id="acc">100.00%</b></div>
            <div><label>PP</label><b id="pp">0</b></div>
            <div><label>If FC</label><b id="ppfc">0</b></div>
        </section>
        <section class="hits">
            <span class="h300" id="h300">0</span>
            <span class="h100" id="h100">0</span>
            <span class="h50" id="h50">0</span>
            <span class="h0" id="h0">0</span>
        </section>
        <div class="progress"><div id="bar"></div></div>
        <footer id="bi-status">connexion…</footer>
    </main>
    <script src="overlay.js"></script>
</body>
</html>
